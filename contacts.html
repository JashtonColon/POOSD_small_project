<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contacts - Knight Contacts Manager</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main>

        <h1>Knights Contact Manager</h1>
                <div class="user-bar">
            <p id="welcome"></p>
            <button type="button" id="signout-button">Sign out</button>
        </div>


        <!-- Search -->
        <section id="search-section">

            <h2>Search Contacts</h2>

                        <form id="search-form" role="search">
                <input id="search-input" type="search" placeholder="Search by name..." aria-label="Search contacts">
                <button type="submit" id="search-button">Search</button>
            </form>

        </section>

         <!-- Contact List -->
        <section id="contacts-section">

            <h2>Contacts</h2>
            <!-- Status messages -->
        <p id="contact-status" role="status" aria-live="polite"></p>
	    <div id="contacts-list">

        	<div class="contact-card">

        	    <div class="contact-info">
            	        <h3>John Smith</h3>
            	        <p>Phone: 407-555-1234</p>
            	        <p>Email: john@example.com</p>
            	    </div>

        	    <div class="contact-actions">
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
        	    </div>

    	        </div>

	    </div>
        </section>



        <!-- Add Contact -->
        <section id="add-contact-section">

            <h2>Add Contact</h2>

            <form id="add-contact-form" novalidate>
                <div>
                    <label for="contact-first-name">First Name</label>
                    <input
                        id="contact-first-name"
                        type="text"
                        required
                    >
                </div>

                <div>
                    <label for="contact-last-name">Last Name</label>
                    <input
                        id="contact-last-name"
                        type="text"
                        required
                    >
                </div>

                <div>
                    <label for="contact-phone">Phone</label>
                    <input
                        id="contact-phone"
                        type="tel"
                    >
                </div>

                <div>
                    <label for="contact-email">Email</label>
                    <input
                        id="contact-email"
                        type="email"
                    >
                </div>

                <button type="submit">
                    Add Contact
                </button>
                                <p id="add-status" role="status" aria-live="polite"></p>
            </form>

        </section>


       

        


    </main>
        <script src="js/api.js"></script>
        <script src="js/contacts.js"></script>
</body>

</html>
