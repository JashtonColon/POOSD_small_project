<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In - Knight Contacts Manager</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
 
</head>

<body>
    <main>
    <h1>Knights Contact Manager</h1>
    
    <form id = "form-signin" novalidate>
    <div class="field">
        <label for="signin-login">Username</label>
        <input id="signin-login" type="text" autocomplete="username" required>
    </div>

    <div class="field">
        <label for="signin-password">Password</label>
        <input id="signin-password" type="password" autocomplete="current-password" required>
    </div>

    <button type="submit">Sign In</button>
    

    <p id="signin-status" role="status" aria-live="polite"></p>

    </form>
        <p>Don't have an account? <a href="register.html">Create one</a></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
